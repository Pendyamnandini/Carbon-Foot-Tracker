version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: carbontracker_db
    environment:
      POSTGRES_DB: carbon_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbon_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: carbontracker_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: carbon_tracker
      DB_USER: postgres
      DB_PASSWORD: admin
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: carbontracker_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog
    container_name: carbontracker_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web GUI

volumes:
  pgdata:
  backend_uploads:
